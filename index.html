<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias</title>
</head>
<body>

    <figure>
        <img title="perfil" src="midia/perfil.jpg" alt="Perfil" width="100" height="100">
        <figcaption>
            Foto de perfil.
        </figcaption>
    </figure>

    <h2 id="musica">Uma música que gosto</h2>
    <p>Escolhi esta faixa instrumental para acompanhar meus estudos.</p>
    <audio autoplay loop controls preload="none" src="midia/audio.mp3">
        Seu navegador não oferece suporte ao elemento audio.
    </audio>
    <p><a href="midia/audio.mp3">Abrir o arquivo de áudio</a></p>

    <h2 id="video">Meu projeto em vídeo</h2>
    <video controls preload="metadata" width="640" poster="midia/poster.webp" playsinline>
        <source src="midia/vi.mp4" type="video/mp4">
        Seu navegador não oferece suporte ao elemento video.
    </video>
    <p><a href="midia/vi.mp4">Abrir o vídeo</a></p>
</body>
</html>
